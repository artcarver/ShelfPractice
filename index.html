<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E">
<title>Shelf Practice Exams</title>
<style>
  :root{
    --navy:#0b4a73;
    --navy-dark:#083958;
    --border:#c7d2da;
    --bg:#eef2f5;
    --text:#1c2b36;
    --muted:#5b6b76;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    background:#fff;
    border-radius:10px;
    padding:36px 40px;
    max-width:560px;
    width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  h1{margin:0 0 6px;font-size:26px;color:var(--navy);}
  p.sub{margin:0 0 24px;color:var(--muted);font-size:14.5px;}
  ul.exam-list{list-style:none;margin:0;padding:0;}
  ul.exam-list li + li{margin-top:12px;}
  a.exam-link{
    display:block;
    padding:16px 18px;
    border:1px solid var(--border);
    border-radius:8px;
    text-decoration:none;
    color:var(--text);
    transition:border-color .15s, box-shadow .15s;
  }
  a.exam-link:hover{
    border-color:var(--navy);
    box-shadow:0 2px 10px rgba(11,74,115,.15);
  }
  a.exam-link .name{font-weight:600;color:var(--navy);font-size:16px;}
  a.exam-link .meta{font-size:13px;color:var(--muted);margin-top:3px;}
  a.exam-link .status{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:8px;padding:3px 10px;border-radius:999px;
    font-size:12.5px;font-weight:600;
  }
  .status .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .status.in-progress{background:#fff6e0;color:#8a5a00;border:1px solid #ecd9a6;}
  .status.completed{background:#e5f4ec;color:#1f6b41;border:1px solid #bfe0cd;}
  li.empty{color:var(--muted);font-size:14px;}
  li.empty code{background:#eef2f5;padding:1px 5px;border-radius:3px;}
</style>
</head>
<body>
  <div class="card">
    <h1>Shelf Practice Exams</h1>
    <p class="sub">Choose an exam to begin. Progress is saved automatically in your browser.</p>
    <!-- Built from exams/manifest.js — add an exam there, not here. -->
    <ul class="exam-list" id="examList"></ul>
  </div>

<script src="exams/manifest.js"></script>
<script>
  const list = document.getElementById('examList');
  const exams = window.EXAMS || [];

  if(!exams.length){
    list.innerHTML = '<li class="empty">No exams are registered in '
                   + '<code>exams/manifest.js</code> yet.</li>';
  }

  // Saved progress lives in localStorage under the same key the engine uses,
  // so each card can say where that exam stands without loading its data.js.
  function examStatus(e){
    try{
      const raw = localStorage.getItem(e.storageKey || ('exam_state_' + e.id));
      if(!raw) return null;
      const s = JSON.parse(raw);
      if(s.graded){
        const pct = s.score && s.score.total
          ? ' · ' + Math.round((s.score.correct / s.score.total) * 100) + '%'
          : '';
        return {cls: 'completed', text: 'Completed' + pct};
      }
      const answered = Object.keys(s.answers || {}).length;
      if(answered > 0 || s.elapsedMs > 0 || s.startTime){
        return {cls: 'in-progress',
                text: 'In progress · ' + answered
                    + (e.items ? ' of ' + e.items : '') + ' answered'};
      }
    }catch(err){}
    return null;
  }

  exams.forEach(e => {
    const meta = [e.label, e.items ? e.items + ' items' : null, 'untimed']
      .filter(Boolean).join(' · ');
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'exam-link';
    a.href = 'exam.html?exam=' + encodeURIComponent(e.slug);
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = e.title;
    const sub = document.createElement('div');
    sub.className = 'meta';
    sub.textContent = meta;
    a.append(name, sub);
    const st = examStatus(e);
    if(st){
      const badge = document.createElement('div');
      badge.className = 'status ' + st.cls;
      const dot = document.createElement('span');
      dot.className = 'dot';
      badge.append(dot, document.createTextNode(st.text));
      a.append(badge);
    }
    li.append(a);
    list.append(li);
  });
</script>
</body>
</html>
