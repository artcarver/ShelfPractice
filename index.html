<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Passed between people who already know what this is, so it has no reason to
     be in anyone's search results. One line to delete if that ever changes. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230b4a73'/%3E%3Crect x='5.4' y='5.6' width='3.2' height='12.8' rx='1.3' fill='%23fff'/%3E%3Crect x='10.4' y='8.2' width='3.2' height='10.2' rx='1.3' fill='%23fff'/%3E%3Crect x='15.4' y='10.6' width='3.2' height='7.8' rx='1.3' fill='%23fff'/%3E%3C/svg%3E">
<title>Shelf Practice Exams</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/transfer.css">
<style>
  body{min-height:100vh;}

  /* The same navy chrome the exam page wears, so moving between the two does
     not feel like two different products. */
  header.topbar{
    background:var(--navy);
    height:52px;
    display:flex;align-items:center;
    padding:0 22px;
  }
  header.topbar :focus-visible{outline-color:#fff;}

  main{max-width:760px;margin:0 auto;padding:32px 22px 56px;}
  h1{margin:0 0 6px;font-size:var(--fs-xl);color:var(--navy-dark);letter-spacing:-.2px;}
  .lede{margin:0;color:var(--muted);font-size:var(--fs-base);line-height:1.55;}

  /* A flat list of every form made the page a scroll rather than a choice, so
     each subject is a panel that opens. The head is a row of the same family as
     the exam rows below it, and the panel is what carries the border. */
  .subject-block{
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--r-md);
    overflow:hidden;
    margin-top:14px;
  }
  .subject-h{margin:0;font-size:inherit;font-weight:inherit;}
  .subject-head{
    width:100%;
    display:flex;align-items:center;gap:14px;
    padding:15px 18px;
    font:inherit;text-align:left;color:inherit;
    background:none;border:0;cursor:pointer;
    transition:background .12s;
  }
  .subject-head:hover{background:var(--navy-tint);}
  .subject-name{
    flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:var(--fs-md);font-weight:600;color:var(--navy-dark);
  }
  .subject-meta{font-size:var(--fs-xs);color:var(--faint);white-space:nowrap;}
  .subject-chev{color:#b3c1cb;flex:none;transition:transform .15s, color .12s;}
  .subject-head:hover .subject-chev{color:var(--navy);}
  .subject-head[aria-expanded="true"] .subject-chev{
    transform:rotate(90deg);color:var(--navy);
  }
  .group{border-top:1px solid var(--divider);}
  a.row{
    display:flex;align-items:center;gap:16px;
    padding:15px 18px;
    text-decoration:none;color:inherit;
    transition:background .12s;
  }
  .row-wrap + .row-wrap{border-top:1px solid var(--divider);}

  /* An exam row is one link and, when there is progress, one Clear button,
     and a button cannot sit inside a link. So the link holds the name and its
     hit area is stretched over the whole row, and Clear sits above that, beside
     the status it would erase. Start, Resume and Review then always end the
     row at its right edge, under the subject chevrons, whether a row has a
     Clear or not. */
  .exam-row{
    position:relative;
    display:flex;align-items:center;gap:16px;
    padding:15px 18px;
    transition:background .12s;
  }
  .exam-row:hover{background:var(--navy-tint);}
  .exam-row .row-link{flex:1 1 auto;min-width:0;text-decoration:none;color:inherit;}
  .exam-row .row-link::after{content:"";position:absolute;inset:0;}
  .exam-row .row-link:focus-visible{outline:none;}
  .exam-row:has(.row-link:focus-visible){outline:2px solid var(--navy);outline-offset:-2px;}
  .exam-row:hover .row-go svg{color:var(--navy);transform:translateX(2px);}
  .exam-row .row-clear{position:relative;z-index:1;}

  /* Clearing an exam throws away answers, highlights and notes with no undo,
     so the control stays out of the way: it appears only on a row that has
     something to clear, reads as faint metadata until you reach for it, and
     asks before it does anything. */
  .row-clear{
    flex:none;
    margin:0 -4px 0 -8px;
    padding:6px 9px;
    border:0;border-radius:var(--r-xs);
    background:none;
    font-family:inherit;font-size:var(--fs-xs);
    color:var(--faint);
    cursor:pointer;
  }
  .row-clear:hover{background:var(--incorrect-bg);color:var(--incorrect);}
  .row-clear:focus-visible{outline:2px solid var(--navy);outline-offset:1px;}
  .row-main{flex:1 1 auto;min-width:0;}
  .row-form{font-weight:600;color:var(--navy);font-size:var(--fs-md);}
  .row-len{font-size:var(--fs-xs);color:var(--faint);margin-top:2px;}

  /* Status earns a line only when there is one — an untouched exam says
     nothing rather than repeating "Not started" down the whole list. */
  .row-state{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;}
  .row-state b{color:var(--text);font-weight:600;}
  /* The results screen prints the score in navy, not in the correct-green —
     a percentage is a number, not a verdict, and 42% set in the green that
     means "you got this right" reads as praise. The two screens now agree. */
  .row-state .pct{color:var(--navy-dark);font-weight:600;}

  .row-go{
    display:flex;align-items:center;gap:5px;
    font-size:var(--fs-sm);font-weight:600;color:var(--navy);
    white-space:nowrap;
  }
  .row-go svg{color:#b3c1cb;transition:color .12s, transform .12s;}
  a.row:hover{background:var(--navy-tint);}
  a.row:hover .row-go svg{color:var(--navy);transform:translateX(2px);}

  /* One line above the list, offering the tour to someone who has not seen it.
     A white box with an accent was still a variation on an exam row, and a
     tinted one read as a row switched off. So it is filled, in the navy the
     top bar already wears: the one surface on this page that is not a white
     panel on grey, which is what makes it legible as a different kind of
     thing at a glance rather than on inspection. It stays one line, and it
     goes for good once an exam has been started. */
  a.tour{
    display:flex;align-items:center;gap:12px;
    margin-top:16px;padding:10px 14px;
    background:var(--navy);
    border:1px solid var(--navy);
    border-radius:var(--r-sm);
    text-decoration:none;
    transition:background .12s, border-color .12s;
  }
  a.tour:hover{background:var(--navy-dark);border-color:var(--navy-dark);}
  a.tour:focus-visible{outline:2px solid var(--navy-dark);outline-offset:2px;}
  .tour-text{
    flex:1 1 auto;min-width:0;
    font-size:var(--fs-sm);line-height:1.5;
    color:#dce8f0;
  }
  .tour-go{
    flex:none;display:flex;align-items:center;gap:4px;
    font-size:var(--fs-sm);font-weight:600;color:#fff;white-space:nowrap;
  }
  .tour-go svg{color:rgba(255,255,255,.6);transition:color .12s, transform .12s;}
  a.tour:hover .tour-go svg{color:#fff;transform:translateX(2px);}
  /* a.tour is a flex box, which outranks the [hidden] attribute on its own */
  a.tour[hidden]{display:none;}

  /* Coming back is the common visit, and the exam you were in the middle of
     is otherwise one click deep inside its subject. So whatever is under way
     sits above the list, newest first, as rows of the same family as the
     exam rows below it: a panel with a small heading, not a banner. */
  .resume-block{
    background:#fff;
    border:1px solid var(--border);
    border-left:4px solid var(--navy);
    border-radius:var(--r-md);
    overflow:hidden;
    margin-top:16px;
  }
  .resume-block[hidden]{display:none;}
  .resume-h{
    margin:0;padding:12px 18px 0;
    font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);
  }
  .resume-block a.row{padding:10px 18px 14px;}
  .resume-block a.row + a.row{border-top:1px solid var(--divider);padding-top:14px;}
  .row-when{color:var(--faint);}

  .foot{margin-top:30px;font-size:var(--fs-xs);color:var(--faint);text-align:center;}
  /* Once the note above has done its work it goes, but the tour itself stays
     reachable from here for good: someone who half-remembers a control and
     wants to look it up should not have to have kept the banner. */
  .foot a{color:var(--faint);text-decoration:underline;}
  .foot a:hover{color:var(--navy);}
  .foot .sep{margin:0 8px;opacity:.55;}
  /* Export and Import are buttons doing a link's job, so they are dressed as
     the link beside them rather than given a shape of their own. */
  .foot-link{
    font-family:inherit;font-size:inherit;
    background:none;border:0;padding:0;
    color:var(--faint);text-decoration:underline;cursor:pointer;
  }
  .foot-link:hover{color:var(--navy);}
  .foot-tools{margin-top:7px;}
  .foot-tools [hidden]{display:none;}
  .empty{
    background:#fff;border:1px solid var(--border);border-radius:var(--r-md);
    padding:20px;color:var(--muted);font-size:var(--fs-base);
  }
  .empty code{background:var(--bg);padding:1px 5px;border-radius:var(--r-xs);}

  /* Every motion on this page is decoration on a hover or a disclosure, so
     there is nothing to keep when someone has asked for less of it. */
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
    /* The open chevron keeps its quarter turn: with the transition gone it is
       a state indicator drawn in one position, not a movement. */
    a.row:hover .row-go svg,
    .exam-row:hover .row-go svg,
    a.tour:hover .tour-go svg{transform:none;}
  }

  @media (max-width:520px){
    main{padding:24px 14px 40px;}
    .row-go span{display:none;}   /* the chevron carries it on a phone */
    /* A phone has no room for name, status and action side by side: the
       subject's counts and a form's status each drop to a second line under
       the name, rather than squeezing it to "Family Medi..." or "CMS Form / 4". */
    .subject-head{display:grid;grid-template-columns:1fr auto;column-gap:14px;row-gap:2px;}
    .subject-name{white-space:normal;}
    .subject-meta{grid-row:2;grid-column:1;white-space:normal;}
    .subject-chev{grid-row:1 / span 2;grid-column:2;}
    .exam-row{display:grid;grid-template-columns:1fr auto auto;column-gap:12px;row-gap:4px;}
    .exam-row .row-state{grid-row:2;grid-column:1;}
    .exam-row .row-clear{grid-row:1 / span 2;grid-column:2;margin:0;}
    .exam-row .row-go{grid-row:1 / span 2;grid-column:3;}
  }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="5.5"/><rect class="mark-bar" x="6" y="6" width="2.9" height="12" rx="1.2"/><rect class="mark-bar" x="10.6" y="8.4" width="2.9" height="9.6" rx="1.2"/><rect class="mark-bar" x="15.2" y="10.6" width="2.9" height="7.4" rx="1.2"/></svg><span class="brand-name">Shelf Practice</span></a>
  </header>

  <main>
    <h1>Practice exams</h1>
    <p class="lede" id="lede">Every item has a full explanation. Progress saves in this browser.</p>

    <a class="tour" href="walkthrough.html" id="tourCard" hidden>
      <span class="tour-text">New here?</span>
      <span class="tour-go"><span>Try a question</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
    </a>

    <section class="resume-block" id="resumeBlock" aria-labelledby="resumeHead" hidden>
      <h2 class="resume-h" id="resumeHead">Pick up where you left off</h2>
      <div id="resumeRows"></div>
    </section>

    <!-- Built from exams/manifest.js — add an exam there, not here. -->
    <div id="examList"></div>

    <p class="foot">Runs entirely in your browser. Nothing is uploaded, no account
      needed.<span class="sep">&middot;</span><a href="walkthrough.html">How it works</a></p>
    <!-- Saved progress lives in this browser and nowhere else, which is the
         point and also the catch: a second device knows nothing about it. These
         two carry it across. Export appears only when there is something to
         export. -->
    <p class="foot foot-tools"><span id="exportWrap" hidden><button type="button"
      class="foot-link" id="exportBtn">Export progress</button><span class="sep">&middot;</span></span><button
      type="button" class="foot-link" id="importBtn">Import progress</button></p>
  </main>

<script src="exams/manifest.js"></script>
<script src="assets/transfer.js"></script>
<script>
  const list  = document.getElementById('examList');
  const exams = window.EXAMS || [];

  if(!exams.length){
    list.innerHTML = '<p class="empty">No exams are registered in '
                   + '<code>exams/manifest.js</code> yet.</p>';
  }

  /* Saved progress lives under the same two keys the engine writes — see the
     note in exams/manifest.js — so a row can say where that exam stands, and
     Clear can forget it, without loading its data.js. */
  const stateKey   = e => e.storageKey || ('exam_state_' + e.id);
  const sessionKey = e => 'exam_session_' + e.id;

  function progressOf(e){
    let s = null;
    try{
      const raw = localStorage.getItem(stateKey(e));
      s = raw ? JSON.parse(raw) : null;
    }catch(err){}
    if(!s) return {kind:'new'};
    if(s.graded && s.score && s.score.total){
      return {kind:'done', correct:s.score.correct, total:s.score.total,
              pct: Math.round((s.score.correct / s.score.total) * 100)};
    }
    const answered = Object.keys(s.answers || {}).length;
    if(answered || s.elapsedMs || s.runningSince)
      return {kind:'going', answered:answered, total:e.items || 0,
              savedAt: s.savedAt || 0};
    return {kind:'new'};
  }

  function chevron(cls){
    return '<svg class="' + cls + '" width="15" height="15" viewBox="0 0 24 24" '
         + 'fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" '
         + 'stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  }
  const CHEV = chevron('');

  function row(e){
    const p = progressOf(e);
    let state = '', cta = 'Start';
    if(p.kind === 'done'){
      state = '<div class="row-state"><span class="pct">' + p.pct + '%</span> · '
            + p.correct + ' of ' + p.total + ' correct</div>';
      cta = 'Review';
    }else if(p.kind === 'going'){
      state = '<div class="row-state"><b>' + p.answered + '</b> of ' + p.total
            + ' answered</div>';
      cta = 'Resume';
    }

    const wrap = document.createElement('div');
    wrap.className = 'row-wrap exam-row';
    const a = document.createElement('a');
    a.className = 'row-link';
    a.href = 'exam.html?exam=' + encodeURIComponent(e.slug);
    a.innerHTML =
      '<div class="row-form">' + (e.label || e.title) + '</div>' +
      '<div class="row-len">' + (e.items ? e.items + ' questions' : 'Practice block') + '</div>';
    // the link's own text is only the form, so a reader gets the rest here
    const stateText = state.replace(/<[^>]+>/g, '');
    a.setAttribute('aria-label', [cta, e.title, e.label, stateText].filter(Boolean).join(', '));
    wrap.append(a);
    if(state) wrap.insertAdjacentHTML('beforeend', state);

    /* An exam you have never opened has nothing to clear, so it gets no
       button. Restarting from inside the exam wipes the answers but leaves the
       exam started; this is the way back to a clean slate. */
    if(p.kind !== 'new'){
      const clear = document.createElement('button');
      clear.type = 'button';
      clear.className = 'row-clear';
      clear.textContent = 'Clear';
      clear.title = 'Forget this exam and start it fresh';
      clear.setAttribute('aria-label',
        [('Clear saved progress for ' + e.title), e.label].filter(Boolean).join(' '));
      clear.addEventListener('click', () => {
        const what = p.kind === 'done'
          ? 'your score and answers'
          : 'your answers so far';
        if(!confirm('Clear ' + (e.label || e.title) + '?\n\n'
                  + 'This forgets ' + what + ', along with any highlights and '
                  + 'notes, and returns the exam to Start. It cannot be undone.')) return;
        forget(e);
        renderList();
      });
      wrap.append(clear);
    }
    wrap.insertAdjacentHTML('beforeend',
      '<div class="row-go" aria-hidden="true"><span>' + cta + '</span>' + CHEV + '</div>');
    return wrap;
  }

  /* Remove every trace of one exam: the saved state the row reads, and the
     per-tab flag that lets a reload skip the start screen. */
  function forget(e){
    try{ localStorage.removeItem(stateKey(e)); }catch(err){}
    try{ sessionStorage.removeItem(sessionKey(e)); }catch(err){}
  }

  /* Sibling forms of one exam share a title — every surgery form is called
     "Surgery Practice Exam" — so the page groups by subject and lets each row
     lead with what distinguishes it: the form label. Under a page called
     Practice exams, the heading only needs the subject. */
  /* The list reads in a fixed order rather than in whatever order the manifest
     happens to be written in. Subjects run alphabetically, since a subject is
     something you go looking for by name. Forms run newest first, since a
     higher form number is the more recent paper and the one most people want:
     the newest form of each subject is the first row under its head. The
     collator counts digits as numbers, so Form 10 sorts above Form 9 rather
     than beside Form 1. */
  const byName = new Intl.Collator(undefined, {numeric: true, sensitivity: 'base'});
  const collected = new Map();
  exams.forEach(e => {
    const subject = e.title.replace(/\s*practice exams?\s*$/i, '') || e.title;
    if(!collected.has(subject)) collected.set(subject, []);
    collected.get(subject).push(e);
  });
  const groups = new Map(
    Array.from(collected.entries())
      .sort((a, b) => byName.compare(a[0], b[0]))
      .map(([subject, members]) => [
        subject,
        members.slice().sort((a, b) => byName.compare(b.label || b.title, a.label || a.title))
      ])
  );

  /* Which subjects are open is remembered per browser, so the list you came
     back to is the one you left. Nothing is open on a first visit — the point
     of the panels is that the page opens as three choices rather than sixteen. */
  const OPEN_KEY = 'shelf_open_subjects';
  function readOpen(){
    try{ return new Set(JSON.parse(localStorage.getItem(OPEN_KEY)) || []); }
    catch(err){ return new Set(); }
  }
  function writeOpen(set){
    try{ localStorage.setItem(OPEN_KEY, JSON.stringify(Array.from(set))); }catch(err){}
  }

  /* The head says how much is inside, and — only when there is something to
     say — how much of it you have touched. */
  function summarize(members){
    let done = 0, going = 0;
    members.forEach(e => {
      const kind = progressOf(e).kind;
      if(kind === 'done') done++;
      else if(kind === 'going') going++;
    });
    const bits = [members.length + (members.length === 1 ? ' form' : ' forms')];
    if(going) bits.push(going + ' in progress');
    if(done) bits.push(done + ' scored');
    return bits.join(' · ');
  }

  /* Rebuilt from scratch after a row is cleared, so the row, its subject
     summary and the panel that holds it all agree again. Which panels are
     open is read back from storage, so nothing closes under you. */
  function renderList(){
    list.innerHTML = '';
    placeTourCard();
    placeTransfer();
    placeResume();
    const open = readOpen();

    groups.forEach((members, subject) => {
      const box = document.createElement('div');
      box.className = 'group';
      box.id = 'subject-' + subject.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      members.forEach(e => box.append(row(e)));

      const head = document.createElement('button');
      head.type = 'button';
      head.className = 'subject-head';
      head.setAttribute('aria-controls', box.id);
      const name = document.createElement('span');
      name.className = 'subject-name';
      name.textContent = subject;
      const meta = document.createElement('span');
      meta.className = 'subject-meta';
      meta.textContent = summarize(members);
      head.append(name, meta);
      head.insertAdjacentHTML('beforeend', chevron('subject-chev'));

      function setOpen(isOpen){
        head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        box.hidden = !isOpen;
      }
      setOpen(open.has(subject));

      head.addEventListener('click', () => {
        const next = head.getAttribute('aria-expanded') !== 'true';
        setOpen(next);
        if(next) open.add(subject); else open.delete(subject);
        writeOpen(open);
      });

      /* A screen reader gets seven subjects to jump between rather than one
         undifferentiated run of buttons. The h2 carries no styling of its
         own — the button inside it is still what is drawn. */
      const heading = document.createElement('h2');
      heading.className = 'subject-h';
      heading.append(head);

      const block = document.createElement('section');
      block.className = 'subject-block';
      block.setAttribute('aria-label', subject);
      block.append(heading, box);
      list.append(block);
    });
  }
  /* What there is comes before how it behaves, and it is counted from the
     manifest rather than typed into the page, so adding a form updates the
     sentence instead of quietly falsifying it. */
  function describeShelf(){
    if(!exams.length) return;
    const items = exams.reduce((n, e) => n + (e.items || 0), 0);
    const forms = exams.length + (exams.length === 1 ? ' form' : ' forms');
    document.getElementById('lede').textContent =
      items
        ? forms.charAt(0).toUpperCase() + forms.slice(1) + ', '
          + items.toLocaleString() + ' items, every one with a full explanation. '
          + 'Progress saves in this browser.'
        : 'Every item has a full explanation. Progress saves in this browser.';
  }

  /* "Today", "yesterday", or the date: when you last worked on it, which is
     what tells two half-done forms apart. Records saved before the engine
     stamped them have no date, and say nothing rather than guess. */
  function when(ms){
    if(!ms) return '';
    const d = new Date(ms), now = new Date();
    const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(now) - day(d)) / 86400000);
    if(diff <= 0) return 'today';
    if(diff === 1) return 'yesterday';
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  }

  function placeResume(){
    const going = exams
      .map(e => ({e, p: progressOf(e)}))
      .filter(x => x.p.kind === 'going')
      .sort((a, b) => b.p.savedAt - a.p.savedAt)
      .slice(0, 3);
    const block = document.getElementById('resumeBlock');
    const rows = document.getElementById('resumeRows');
    rows.innerHTML = '';
    block.hidden = !going.length;
    going.forEach(({e, p}) => {
      const subject = e.title.replace(/\s*practice exams?\s*$/i, '') || e.title;
      const a = document.createElement('a');
      a.className = 'row';
      a.href = 'exam.html?exam=' + encodeURIComponent(e.slug);
      const last = when(p.savedAt);
      a.innerHTML =
        '<div class="row-main">' +
          '<div class="row-form">' + subject + (e.label ? ' · ' + e.label : '') + '</div>' +
          '<div class="row-len"><b>' + p.answered + '</b> of ' + p.total + ' answered' +
            (last ? '<span class="row-when"> · ' + last + '</span>' : '') + '</div>' +
        '</div>' +
        '<div class="row-go"><span>Resume</span>' + CHEV + '</div>';
      rows.append(a);
    });
  }

  /* The card exists to answer "is this just screenshots", and anyone who has
     opened an exam has already had it answered. It shows on a first visit and
     then gets out of the way for good, which is what lets it be loud. */
  function placeTourCard(){
    const started = exams.some(e => progressOf(e).kind !== 'new');
    document.getElementById('tourCard').hidden = started;
  }

  /* ---------- carrying progress to another browser ---------- */

  /* The file is meant to survive being looked at: it opens with what is in it,
     in the words the list uses, and the block a machine reads comes after. */
  function exportText(started){
    const stamp = new Date();
    const lines = ['ShelfPractice saved progress',
                   'Exported ' + stamp.toISOString().slice(0, 10), ''];
    started.forEach(e => {
      const p = progressOf(e);
      const where = p.kind === 'done'
        ? 'scored ' + p.pct + '%, ' + p.correct + ' of ' + p.total + ' correct'
        : p.answered + ' of ' + (e.items || '?') + ' answered';
      lines.push('  ' + (e.title + (e.label ? ' ' + e.label : '')) + ' - ' + where);
    });
    lines.push('', 'To load this into another browser, open the exam list there and',
                   'choose Import progress at the foot of the page.');
    return lines.join('\n') + SHELF_TRANSFER.wrap(SHELF_TRANSFER.payload(started));
  }

  function startedExams(){
    return exams.filter(e => progressOf(e).kind !== 'new');
  }

  function placeTransfer(){
    document.getElementById('exportWrap').hidden = !startedExams().length;
  }

  document.getElementById('exportBtn').addEventListener('click', () => {
    const started = startedExams();
    if(!started.length) return;
    SHELF_TRANSFER.download(
      'shelfpractice-progress-' + new Date().toISOString().slice(0, 10) + '.txt',
      exportText(started));
  });

  document.getElementById('importBtn').addEventListener('click', () => {
    SHELF_TRANSFER.pick((text, name) => {
      SHELF_TRANSFER.importFrom(text == null ? '' : text, exams, () => renderList(), name);
    });
  });

  /* Another tab of this site can change what is saved — most obviously by
     importing into it — and the storage event fires only in the tabs that did
     not do the writing, which is exactly the set that is now out of date. */
  window.addEventListener('storage', () => renderList());

  if(exams.length){
    describeShelf();
    renderList();
  }
</script>
</body>
</html>
