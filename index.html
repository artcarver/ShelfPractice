<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shelf Practice Exams</title>
<style>
  :root{
    --navy:#0b4a73;
    --navy-dark:#083958;
    --border:#c7d2da;
    --bg:#eef2f5;
    --text:#1c2b36;
    --muted:#5b6b76;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    background:#fff;
    border-radius:10px;
    padding:36px 40px;
    max-width:560px;
    width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  h1{margin:0 0 6px;font-size:26px;color:var(--navy);}
  p.sub{margin:0 0 24px;color:var(--muted);font-size:14.5px;}
  ul.exam-list{list-style:none;margin:0;padding:0;}
  ul.exam-list li + li{margin-top:12px;}
  a.exam-link{
    display:block;
    padding:16px 18px;
    border:1px solid var(--border);
    border-radius:8px;
    text-decoration:none;
    color:var(--text);
    transition:border-color .15s, box-shadow .15s;
  }
  a.exam-link:hover{
    border-color:var(--navy);
    box-shadow:0 2px 10px rgba(11,74,115,.15);
  }
  a.exam-link .name{font-weight:600;color:var(--navy);font-size:16px;}
  a.exam-link .meta{font-size:13px;color:var(--muted);margin-top:3px;}
</style>
</head>
<body>
  <div class="card">
    <h1>Shelf Practice Exams</h1>
    <p class="sub">Choose an exam to begin. Progress is saved automatically in your browser.</p>
    <ul class="exam-list">
      <li>
        <a class="exam-link" href="exams/surgery-practice-exam-v4/">
          <div class="name">Surgery Practice Exam</div>
          <div class="meta">CMS Form 9 &middot; 50 items &middot; untimed</div>
        </a>
      </li>
      <!-- To add a new exam, copy an existing folder under exams/, replace its
           data.js, and add a link here. See README.md for details. -->
    </ul>
  </div>
</body>
</html>
